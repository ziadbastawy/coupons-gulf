# Production stack for a single server: website + Postgres + Caddy (automatic HTTPS).
# Start / update:  docker compose up -d --build
# Settings come from .env (copy .env.server.example). Full guide: DEPLOY.md

services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://coupons:${POSTGRES_PASSWORD}@db:5432/coupons
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      SITE_URL: https://${DOMAIN}
    volumes:
      - media:/app/media
    expose:
      - '3000'

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: coupons
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: coupons
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U coupons -d coupons']
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
